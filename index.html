<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skald Group</title>
<meta name="description" content="Skald Group LLC — tools and investments.">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/favicon.png">
<meta property="og:title" content="Skald Group">
<meta property="og:description" content="Skald Group LLC — tools and investments.">
<meta property="og:image" content="assets/skald-logo-lockup.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --black: #0a0a0a;
    --panel: #141414;
    --panel-line: #262626;
    --white: #f5f5f2;
    --dim: #9a9a94;
    --yellow: #e2ff26;
    --yellow-dim: #b6cc1e;
  }

  *{ box-sizing: border-box; }

  html{ scroll-behavior: smooth; }

  body{
    margin: 0;
    background: var(--black);
    color: var(--white);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3, h4{
    font-family: 'Space Grotesk', 'Inter', sans-serif;
    margin: 0;
  }

  a{ color: inherit; }

  .hl{ color: var(--yellow); }

  /* ---------- Nav ---------- */
  .nav{
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px clamp(20px, 5vw, 64px);
    background: rgba(10,10,10,0.85);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--panel-line);
  }
  .nav .brand{
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .nav .logo-mark{
    width: 34px;
    height: 34px;
    border-radius: 4px;
    display: block;
  }
  .nav .wordmark{
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    letter-spacing: 0.04em;
    font-size: 1.1rem;
    text-transform: uppercase;
  }
  .nav .wordmark span{ color: var(--yellow); }
  .nav ul{
    list-style: none;
    display: flex;
    gap: clamp(16px, 3vw, 32px);
    margin: 0;
    padding: 0;
  }
  .nav a{
    text-decoration: none;
    color: var(--dim);
    font-size: 0.9rem;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    transition: color 0.2s ease;
  }
  .nav a:hover{ color: var(--yellow); }

  /* ---------- Hero ---------- */
  .hero{
    position: relative;
    display: grid;
    grid-template-columns: 1.1fr 0.9fr;
    align-items: center;
    gap: 48px;
    padding: clamp(56px, 10vw, 120px) clamp(20px, 5vw, 64px);
    overflow: hidden;
  }
  .hero::before{
    content: "";
    position: absolute;
    inset: -20% -10%;
    background:
      radial-gradient(circle at 15% 20%, rgba(226,255,38,0.10), transparent 45%),
      radial-gradient(circle at 85% 75%, rgba(226,255,38,0.06), transparent 40%);
    pointer-events: none;
  }
  .eyebrow{
    display: inline-block;
    color: var(--yellow);
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 18px;
  }
  .hero h1{
    font-size: clamp(3rem, 7vw, 5.5rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 0.98;
    text-transform: uppercase;
  }
  .pitch{
    margin-top: 24px;
    max-width: 46ch;
    color: var(--dim);
    font-size: 1.05rem;
  }
  .hero-actions{
    margin-top: 32px;
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
  }
  .btn{
    display: inline-block;
    padding: 13px 26px;
    border-radius: 4px;
    font-size: 0.9rem;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    text-decoration: none;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn-primary{
    background: var(--yellow);
    color: var(--black);
  }
  .btn-primary:hover{
    box-shadow: 0 0 24px rgba(226,255,38,0.45);
    transform: translateY(-1px);
  }
  .btn-ghost{
    border: 1px solid var(--panel-line);
    color: var(--white);
  }
  .btn-ghost:hover{ border-color: var(--yellow); color: var(--yellow); }

  .hero-visual{
    position: relative;
    aspect-ratio: 1 / 1;
    border: 1px solid var(--panel-line);
    border-radius: 8px;
    background:
      linear-gradient(135deg, rgba(226,255,38,0.08), transparent 60%),
      repeating-linear-gradient(45deg, rgba(226,255,38,0.05) 0 2px, transparent 2px 26px),
      var(--panel);
    overflow: hidden;
  }
  .hero-visual .ship{
    position: absolute;
    inset: 0;
    width: 68%;
    height: 68%;
    margin: auto;
    object-fit: contain;
    opacity: 0.9;
    filter: drop-shadow(0 0 22px rgba(226,255,38,0.25));
  }
  .hero-visual .corner{
    position: absolute;
    width: 10px;
    height: 10px;
    border: 2px solid var(--yellow);
  }
  .corner.tl{ top: 18px; left: 18px; border-right: none; border-bottom: none; }
  .corner.br{ bottom: 18px; right: 18px; border-left: none; border-top: none; }

  /* ---------- Sections ---------- */
  main{
    padding: 0 clamp(20px, 5vw, 64px) 40px;
  }
  section.block{
    padding: clamp(48px, 8vw, 88px) 0;
    border-top: 1px solid var(--panel-line);
  }
  .block-head{
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 32px;
  }
  .block-head .index{
    color: var(--yellow);
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
  }
  section.block h2{
    font-size: clamp(2rem, 4vw, 2.75rem);
    text-transform: uppercase;
    letter-spacing: -0.01em;
  }
  .grid{
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 18px;
  }

  .card{
    position: relative;
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 6px;
    padding: 28px 24px;
    transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
  }
  .card:hover{
    border-color: var(--yellow);
    transform: translateY(-3px);
    box-shadow: 0 8px 28px rgba(226,255,38,0.08);
  }
  .card .tag{
    display: inline-block;
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--yellow);
    margin-bottom: 12px;
  }
  .card h4{
    font-size: 1.25rem;
    font-weight: 600;
  }
  .card p{
    color: var(--dim);
    font-size: 0.92rem;
    margin: 10px 0 0;
  }

  /* Brands */
  .brand-card{
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 150px;
  }
  .brand-card .brand-name{
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.6rem;
    font-weight: 700;
  }
  .brand-card .brand-name span{ color: var(--yellow); }

  @media (max-width: 800px){
    .hero{ grid-template-columns: 1fr; }
    .hero-visual{ order: -1; max-width: 320px; margin: 0 auto; }
  }

  @media (max-width: 560px){
    .nav{ flex-direction: column; align-items: flex-start; gap: 12px; }
    .nav ul{ gap: 16px; width: 100%; }
  }

  footer{
    padding: 28px clamp(20px, 5vw, 64px) 40px;
    border-top: 1px solid var(--panel-line);
    color: var(--dim);
    font-size: 0.85rem;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }
  footer .brand-line{
    display: flex;
    align-items: center;
    gap: 10px;
  }
  footer .brand-line img{
    width: 18px;
    height: 18px;
    opacity: 0.7;
  }
</style>
</head>
<body>

  <nav class="nav">
    <div class="brand">
      <img class="logo-mark" src="assets/favicon.png" alt="">
      <div class="wordmark">Skald<span>Group</span></div>
    </div>
    <ul>
      <li><a href="#tools">Tools</a></li>
      <li><a href="#investments">Investments</a></li>
    </ul>
  </nav>

  <header class="hero">
    <div class="hero-copy">
      <span class="eyebrow">Skald Group LLC</span>
      <h1>Skald<br>Group</h1>
      <p class="pitch">
        Skald Group builds tools and invests in inspiring visions.
      </p>
      <div class="hero-actions">
        <a class="btn btn-primary" href="#tools">Tools</a>
        <a class="btn btn-ghost" href="#investments">Investments</a>
      </div>
    </div>
    <div class="hero-visual" aria-hidden="true">
      <img class="ship" src="assets/longship-yellow.png" alt="">
      <span class="corner tl"></span>
      <span class="corner br"></span>
    </div>
  </header>

  <main>

    <section class="block" id="tools">
      <div class="block-head">
        <span class="index">01</span>
        <h2>Tools</h2>
      </div>

      <div class="grid">
        <div class="card brand-card">
          <span class="tag">Tool</span>
          <div class="brand-name">Chop<span>Word</span></div>
        </div>
      </div>
    </section>

    <section class="block" id="investments">
      <div class="block-head">
        <span class="index">02</span>
        <h2>Investments</h2>
      </div>

      <div class="grid">
        <div class="card">
          <span class="tag">Theme</span>
          <h4>Mortgage / Homeownership</h4>
        </div>
        <div class="card">
          <span class="tag">Theme</span>
          <h4>eVTOL Aviation</h4>
        </div>
        <div class="card">
          <span class="tag">Theme</span>
          <h4>Interactive Entertainment</h4>
        </div>
      </div>
    </section>

  </main>

  <footer>
    <span class="brand-line"><img src="assets/longship-white.png" alt="">&copy; 2026 Skald Group LLC</span>
  </footer>

</body>
</html>
